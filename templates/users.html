<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи - CherrySmart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="nav-bar">
        <div class="nav-content">
            <div class="logo-nav">
                <span class="nav-title">CherrySmart</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link"><i class="fas fa-chart-line"></i> Дашборд</a>
                <a href="/users" class="nav-link active"><i class="fas fa-users"></i> Пользователи</a>
                <a href="/settings" class="nav-link"><i class="fas fa-cog"></i> Настройки</a>
                <a href="/logout" class="nav-link logout"><i class="fas fa-sign-out-alt"></i> Выйти</a>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="container wide">
            <div class="page-header">
                <h1><i class="fas fa-users"></i> Управление юзерами</h1>
                <button class="button primary" onclick="showAddUserModal()">
                    <i class="fas fa-user-plus"></i> Добавить юзера
                </button>
            </div>
            <div class="users-table">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>Роль</th>
                            <th>Telegram ID</th>
                            <th>Уведомления</th>
                            <th>Дата создания</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="7" class="loading">Загрузка...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="addUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Добавить юзера</h2>
                <button class="close-btn" onclick="closeModal('addUserModal')">&times;</button>
            </div>
            <form id="addUserForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Логин</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Пароль</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Роль</label>
                    <select name="role">
                        <option value="user">Пользователь</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fab fa-telegram"></i> Telegram ID</label>
                    <input type="number" name="telegram_id" placeholder="Необязательно">
                </div>
                <div class="modal-actions">
                    <button type="button" class="button secondary" onclick="closeModal('addUserModal')">Отмена</button>
                    <button type="submit" class="button primary">Создать</button>
                </div>
            </form>
        </div>
    </div>
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Редактировать юзера</h2>
                <button class="close-btn" onclick="closeModal('editUserModal')">&times;</button>
            </div>
            <form id="editUserForm">
                <input type="hidden" name="user_id">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Логин</label>
                    <input type="text" name="username" disabled>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Новый пароль</label>
                    <input type="password" name="password" placeholder="Оставьте пустым для сохранения текущего">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Роль</label>
                    <select name="role">
                        <option value="user">Пользователь</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fab fa-telegram"></i> Telegram ID</label>
                    <input type="number" name="telegram_id" placeholder="Необязательно">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="notifications_enabled">
                        <span>Уведомления включены</span>
                    </label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="button secondary" onclick="closeModal('editUserModal')">Отмена</button>
                    <button type="submit" class="button primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-modal-content">
            <div class="confirm-icon danger">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="confirm-title">Подтверждение действия</h3>
            <p class="confirm-message" id="confirmMessage"></p>
            <div class="confirm-actions">
                <button class="button secondary" onclick="closeConfirmModal()">Отмена</button>
                <button class="button primary" id="confirmButton">Удалить</button>
            </div>
        </div>
    </div>
    <script>
        let confirmCallback = null;
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();      
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td><span class="role-badge ${user.role}">${user.role === 'admin' ? 'Админ' : 'Пользователь'}</span></td>
                        <td>${user.telegram_id || '-'}</td>
                        <td><i class="fas fa-${user.notifications_enabled ? 'check-circle' : 'times-circle'}" style="color: ${user.notifications_enabled ? '#00b956' : '#999'}"></i></td>
                        <td>${new Date(user.created_at).toLocaleDateString('ru-RU')}</td>
                        <td class="actions">
                            <button class="action-btn edit" onclick="editUser(${user.id})" title="Редактировать">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete" onclick="deleteUser(${user.id}, '${user.username}')" title="Удалить">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Ошибка загрузки пользователей:', error);
            }
        }

        function showAddUserModal() {
            document.getElementById('addUserModal').classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function showConfirmModal(message, callback) {
            document.getElementById('confirmMessage').innerHTML = message;
            document.getElementById('confirmModal').classList.add('show');
            confirmCallback = callback;
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            confirmCallback = null;
        }

        document.getElementById('confirmButton').addEventListener('click', () => {
            if (confirmCallback) {
                confirmCallback();
                closeConfirmModal();
            }
        });

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            if (!data.telegram_id) delete data.telegram_id;
            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    closeModal('addUserModal');
                    e.target.reset();
                    loadUsers();
                    showNotification('Юзер создан', 'success');
                } else {
                    showNotification(result.error || 'Ошибка создания', 'error');
                }
            } catch (error) {
                showNotification('Ошибка создания юзера', 'error');
            }
        });

        async function editUser(userId) {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                const user = users.find(u => u.id === userId);
                if (user) {
                    const form = document.getElementById('editUserForm');
                    form.querySelector('[name="user_id"]').value = user.id;
                    form.querySelector('[name="username"]').value = user.username;
                    form.querySelector('[name="role"]').value = user.role;
                    form.querySelector('[name="telegram_id"]').value = user.telegram_id || '';
                    form.querySelector('[name="notifications_enabled"]').checked = user.notifications_enabled;
                    document.getElementById('editUserModal').classList.add('show');
                }
            } catch (error) {
                console.error('Ошибка загрузки данных юзера:', error);
            }
        }

        document.getElementById('editUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const userId = data.user_id;
            delete data.user_id;
            delete data.username;
            if (!data.password) delete data.password;
            if (!data.telegram_id) delete data.telegram_id;
            data.notifications_enabled = data.notifications_enabled === 'on';
            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    closeModal('editUserModal');
                    loadUsers();
                    showNotification('Юзер обновлен', 'success');
                } else {
                    const result = await response.json();
                    showNotification(result.error || 'Ошибка обновления', 'error');
                }
            } catch (error) {
                showNotification('Ошибка обновления юзера', 'error');
            }
        });

        async function deleteUser(userId, username) {
            showConfirmModal(
                `Вы уверены, что хотите удалить юзера <b>${username}</b>?`,
                async () => {
                    try {
                        const response = await fetch(`/api/users/${userId}`, {
                            method: 'DELETE'
                        });
                        const result = await response.json();        
                        if (response.ok) {
                            loadUsers();
                            showNotification('Пользователь удален', 'success');
                        } else {
                            showNotification(result.error || 'Ошибка удаления', 'error');
                        }
                    } catch (error) {
                        showNotification('Ошибка удаления юзера', 'error');
                    }
                }
            );
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            document.body.appendChild(notification);   
            setTimeout(() => notification.classList.add('show'), 10);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        window.onclick = (event) => {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('show');
            }
            if (event.target.classList.contains('confirm-modal')) {
                closeConfirmModal();
            }
        };

        loadUsers();
    </script>
</body>
</html>
