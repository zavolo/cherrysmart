<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CherrySmart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/page@1.11.6/page.js"></script>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-content">
            <div class="logo-nav">
                <div class="logo-small"></div>
                <span class="nav-title">CherrySmart</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link"><i class="fas fa-chart-line"></i> Дашборд</a>
                <a href="/users" class="nav-link"><i class="fas fa-users"></i> Пользователи</a>
                <a href="/settings" class="nav-link"><i class="fas fa-cog"></i> Настройки</a>
                <a href="#" class="nav-link logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выйти</a>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div id="app"></div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = '/login';
        });
    </script>
    <script type="module" src="{{ url_for('static', filename='js/router.js') }}"></script>
</body>
</html>
